<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classificador de Faturas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(45, 106, 159, 0.12);
            padding: 40px 48px;
            max-width: 520px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            color: #2d6a9f;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header p {
            color: #6b7c93;
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .divider {
            border: none;
            border-top: 2px solid #e8f0f9;
            margin: 0 0 28px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #d0dce8;
            border-radius: 8px;
            font-size: 1rem;
            color: #2d3748;
            transition: border-color 0.2s;
            outline: none;
            background: #f8fafc;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #2d6a9f;
            background: #fff;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #2d6a9f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn:hover { background: #245a8a; }
        .btn:active { transform: scale(0.99); }

        .result-box {
            margin-top: 28px;
            padding: 24px;
            background: linear-gradient(135deg, #e8f2fc 0%, #d0e6f9 100%);
            border-radius: 10px;
            border-left: 5px solid #2d6a9f;
            text-align: center;
        }

        .result-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #2d6a9f;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-category {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a3f5f;
            margin-bottom: 10px;
        }

        .result-confidence {
            font-size: 1rem;
            color: #4a7ea8;
            font-weight: 500;
        }

        .result-confidence span {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d6a9f;
        }

        .error-box {
            margin-top: 20px;
            padding: 14px 18px;
            background: #fff5f5;
            border-radius: 8px;
            border-left: 4px solid #e53e3e;
            color: #c53030;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Classificador de Faturas</h1>
            <p>Associação Desportiva &middot; Escola de Andebol</p>
        </div>
        <hr class="divider">

        <form method="POST" action="/predict">
            <div class="form-group">
                <label for="fornecedor">Fornecedor</label>
                <input type="text" id="fornecedor" name="fornecedor"
                       placeholder="ex: Decathlon, EDP, NOS..."
                       value="{{ fornecedor or '' }}" required>
            </div>
            <div class="form-group">
                <label for="valor">Valor em €</label>
                <input type="number" id="valor" name="valor"
                       placeholder="ex: 125.50"
                       step="0.01" min="0"
                       value="{{ valor or '' }}" required>
            </div>
            <div class="form-group">
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao"
                       placeholder="ex: Compra de bolas de andebol"
                       value="{{ descricao or '' }}" required>
            </div>
            <button type="submit" class="btn">Classificar</button>
        </form>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        {% if result %}
        <div class="result-box">
            <div class="result-label">Categoria prevista</div>
            <div class="result-category">{{ result.categoria }}</div>
            <div class="result-confidence">
                Confiança: <span>{{ result.confianca }}%</span>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
