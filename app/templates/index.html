<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classificador de Faturas · Escola de Andebol</title>
  
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
  <div class="header-inner">
    <svg class="logo" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="18" fill="#2d6a9f" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
      <path d="M20 2 C20 2 28 10 28 20 C28 30 20 38 20 38" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M20 2 C20 2 12 10 12 20 C12 30 20 38 20 38" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M3 14 Q20 18 37 14" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M3 26 Q20 22 37 26" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="header-titles">
      <h1>Classificador de Faturas</h1>
      <p>Associação Desportiva · Escola de Andebol</p>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" onclick="showTab('classificar', this)">🤾 Classificar</button>
      <button class="tab-btn" onclick="showTab('historico', this)">📋 Histórico</button>
    </nav>
  </div>
</header>

<main>
  <section id="sec-classificar" class="section active">
    
    <div class="card">
      <div class="card-title">📄 Upload de fatura em PDF</div>
      <div class="drop-zone" id="drop-zone">
        <input type="file" accept=".pdf" id="pdf-input" onchange="handlePdfUpload(this.files[0])">
        <div class="drop-icon">📂</div>
        <p><strong>Arrasta uma fatura em PDF</strong> ou clica para selecionar</p>
      </div>
      <div class="pdf-status" id="pdf-status"></div>
    </div>

    <div class="card" id="container-preenchimento" style="display: none;">
      <div class="card-title">📝 Dados Extraídos (Podes editar)</div>
      <div class="form-grid">
        <div class="field form-full">
          <label for="fornecedor">Fornecedor</label>
          <input type="text" id="fornecedor" placeholder="ex: Decathlon, EDP, NOS…">
        </div>
        <div class="field">
          <label for="valor">Valor em €</label>
          <input type="number" id="valor" placeholder="ex: 125.50" step="0.01" min="0">
        </div>
        <div class="field">
          <label for="data">Data</label>
          <input type="date" id="data">
        </div>
        <div class="field form-full">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="ex: Compra de bolas de andebol">
        </div>
      </div>
    </div>

    <button class="btn-primary" onclick="classify()" id="classify-btn" style="margin-top: 10px;">
      <span>⚡</span> Classificar Fatura
    </button>
    <div class="error-msg" id="error-msg" style="display:none; margin-top: 15px;"></div>

    <div id="result-box">
      <div class="result-header">
        <div>
          <div class="result-main-label">Categoria sugerida (Podes corrigir)</div>
          <select class="result-main-cat" id="result-cat" style="border: 2px dashed var(--blue-mid); border-radius: 8px; background: var(--white); padding: 6px 12px; cursor: pointer; outline: none; font-family: inherit;">
            <option value="Material Desportivo">Material Desportivo</option>
            <option value="Água Luz e Gás">Água Luz e Gás</option>
            <option value="Comunicações">Comunicações</option>
            <option value="Seguros">Seguros</option>
            <option value="Alimentação e Bebidas">Alimentação e Bebidas</option>
            <option value="Transportes e Deslocações">Transportes e Deslocações</option>
            <option value="Publicidade e Marketing">Publicidade e Marketing</option>
            <option value="Serviços de Contabilidade">Serviços de Contabilidade</option>
            <option value="Equipamento Informático">Equipamento Informático</option>
            <option value="Arbitragem e Competições">Arbitragem e Competições</option>
            <option value="Manutenção e Reparações">Manutenção e Reparações</option>
          </select>
        </div>
        <button class="btn-save" id="btn-save" onclick="saveToHistory()">💾 Guardar no histórico</button>
      </div>
    </div>
  </section>

  <section id="sec-historico" class="section">
    <div class="card">
      <div class="historico-header">
        <h2>📋 Faturas classificadas</h2>
        <button class="btn-danger" onclick="clearHistory()">🗑 Limpar histórico</button>
      </div>
      <div id="historico-content"></div>
    </div>
  </section>
</main>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
